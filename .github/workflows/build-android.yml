name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'spawn-ai-mobile/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Install dependencies
        working-directory: spawn-ai-mobile
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        working-directory: spawn-ai-mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build APK
        working-directory: spawn-ai-mobile/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spawn-ai-debug
          path: spawn-ai-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
