name: Push Projects to Separate Repos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'spawn-ai/**'
      - 'readyprompts/**'
      - 'portfolio/**'
      - 'colddm/**'
      - 'whispr/**'
      - 'draftwin/**'
      - 'toynar/**'
      - 'sinar-clothing/**'

jobs:
  push-spawn-ai:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(toJson(github.event.commits.*.modified + github.event.commits.*.added), 'spawn-ai/')
    steps:
      - uses: actions/checkout@v4
      - name: Push spawn-ai
        env:
          PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          cd spawn-ai
          git init
          git config user.email "mikeronny18@gmail.com"
          git config user.name "Mikeronny16"
          find . -name ".env" -not -name ".env.example" -delete
          git add .
          git commit -m "sync from monorepo"
          git branch -M main
          git remote add origin https://Mikeronny16:$PAT@github.com/Mikeronny16/spawn-ai.git
          git push -u origin main --force

