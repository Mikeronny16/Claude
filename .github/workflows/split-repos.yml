name: Push Projects to Separate Repos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'spawn-ai/**'
      - 'readyprompts/**'
      - 'portfolio/**'
      - 'colddm/**'
      - 'whispr/**'
      - 'draftwin/**'
      - 'toynar/**'
      - 'sinar-clothing/**'
      - 'tikcheck/**'

jobs:
  push-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push portfolio
        env:
          PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          cd portfolio
          git init
          git config user.email "mikeronny18@gmail.com"
          git config user.name "Mikeronny16"
          find . -name ".env" -not -name ".env.example" -delete
          git add .
          git commit -m "sync from monorepo" || echo "Nothing to commit"
          git branch -M main
          git remote add origin https://Mikeronny16:$PAT@github.com/Mikeronny16/portfolio.git
          git push -u origin main --force

  push-tikcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push tikcheck
        env:
          PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          cd tikcheck
          git init
          git config user.email "mikeronny18@gmail.com"
          git config user.name "Mikeronny16"
          find . -name ".env" -not -name ".env.example" -delete
          find . -name "node_modules" -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name ".next" -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git add .
          git commit -m "sync from monorepo" || echo "Nothing to commit"
          git branch -M main
          git remote add origin https://Mikeronny16:$PAT@github.com/Mikeronny16/tikcheck.git
          git push -u origin main --force

