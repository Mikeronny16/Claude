<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E6F5C"/>
      <stop offset="100%" style="stop-color:#13503F"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A024"/>
      <stop offset="100%" style="stop-color:#E8901A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#docGrad)"/>

  <!-- Document -->
  <rect x="28" y="22" width="56" height="70" rx="6" fill="white" opacity="0.95"/>

  <!-- Corner fold shadow -->
  <polygon points="62,22 84,22 84,44" fill="#0F3D2E" opacity="0.35"/>
  <!-- Corner fold amber -->
  <polygon points="62,22 84,44 62,44" fill="url(#sparkGrad)"/>

  <!-- Text lines -->
  <rect x="36" y="52" width="36" height="5" rx="2.5" fill="#1E6F5C" opacity="0.35"/>
  <rect x="36" y="63" width="28" height="5" rx="2.5" fill="#1E6F5C" opacity="0.35"/>
  <rect x="36" y="74" width="32" height="5" rx="2.5" fill="#1E6F5C" opacity="0.35"/>
  <rect x="36" y="85" width="22" height="5" rx="2.5" fill="#1E6F5C" opacity="0.2"/>

  <!-- Star sparkle on fold -->
  <g transform="translate(73,33)" filter="url(#glow)">
    <polygon points="0,-7.5 2,-2.6 7,-2.3 3.2,1.3 4.5,7 0,4 -4.5,7 -3.2,1.3 -7,-2.3 -2,-2.6"
      fill="#F4A024"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="96" cy="96" r="4.5" fill="#F4A024" opacity="0.7"/>
  <circle cx="108" cy="96" r="3" fill="#F4A024" opacity="0.4"/>
</svg>
